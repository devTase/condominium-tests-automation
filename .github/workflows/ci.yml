name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tests repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

  e2e:
    needs: lint
    runs-on: ubuntu-latest
    env:
      SECURITY_BYPASS: 'true'
    steps:
      - name: Checkout tests repo
        uses: actions/checkout@v4

      - name: Checkout UI repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/condominium-hsh-ui
          path: condominium-hsh-ui
          fetch-depth: 0

      - name: Checkout backend repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/condominium-hsh-be
          path: condominium-hsh-be
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install tests dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Install UI dependencies
        run: npm ci
        working-directory: condominium-hsh-ui

      - name: Prepare backend wrapper
        run: chmod +x mvnw
        working-directory: condominium-hsh-be

      - name: Run Playwright suite
        env:
          SECURITY_BYPASS: 'true'
        run: npm test


